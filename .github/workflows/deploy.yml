name: Deploy minified to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify shared data layout
        run: |
          # Option 2: preview borrows Main's data via ../data/. The preview
          # tree must NOT contain its own data/ folder, and preview JS must
          # not import from ./data/ — both would silently shadow the shared
          # copy and could drift out of sync with the Main build.

          if [ -d preview/data ]; then
            echo "::error::preview/data/ exists."
            echo "Option 2 expects preview to import from ../data/ instead."
            echo "Delete preview/data/ and update the JS imports, then re-push."
            exit 1
          fi

          MATCHES="$(grep -rnE "from ['\"]\./data/" preview --include='*.js' || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Preview still imports from ./data/:"
            echo "$MATCHES"
            echo "Change these to ../data/ to reach Main's shared copy."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify module imports resolve
        # `node --check` (run later, on the minified output) parses each file
        # in isolation and terser does not bundle, so NEITHER catches an
        # import that names a symbol the target module does not export. That
        # mistake passes CI green and then throws, in the browser:
        #   SyntaxError: The requested module './core.js' does not provide an
        #   export named 'typoedName'
        # i.e. a blank page for every visitor. This closes that gap.
        #
        # A single '.' walk covers both trees: the root modules and
        # preview/, which imports ../data/ from outside its own directory.
        run: node tools/check-imports.mjs .

      - name: Install minifiers
        run: npm install --no-save --no-package-lock terser@5.51.2 csso-cli@4.0.2

      - name: Build deploy dir
        run: |
          set -e
          TERSER="$(pwd)/node_modules/.bin/terser"
          CSSO="$(pwd)/node_modules/.bin/csso"

          # $3 = space-separated list of extra module files to minify/check
          #      (lets Main and Preview have different module graphs).
          # $4 = 'yes' if this source tree owns its own data/ folder.
          #      Main: yes. Preview: no — it imports from ../data/.
          build_one() {
            SRC="$1"
            DEST="$2"
            EXTRA="${3:-}"
            OWN_DATA="${4:-yes}"

            mkdir -p "$DEST/icons"
            if [ "$OWN_DATA" = "yes" ]; then
              mkdir -p "$DEST/data"
            fi

            cp "$SRC/index.html" "$DEST/"
            # Preview reuses the root favicon via ../favicon.svg, so it has no local copy.
            [ -f "$SRC/favicon.svg" ] && cp "$SRC/favicon.svg" "$DEST/" || true
            # KAO banner is a classic script (no imports): minify plainly, never as a module.
            # Preview reuses the root copy via ../kao-banner.js.
            [ -f "$SRC/kao-banner.js" ] && cp "$SRC/kao-banner.js" "$DEST/" || true
            [ -d "$SRC/icons" ] && cp -R "$SRC/icons/." "$DEST/icons/" || true

            # Aggressive but verified-safe: --module preserves all import/export
            # bindings, so toplevel mangle only touches file-local names.
            for f in main core standard-view calendar $EXTRA; do
              "$TERSER" "$SRC/$f.js" --module -c passes=3,toplevel -m toplevel -o "$DEST/$f.js"
            done

            if [ "$OWN_DATA" = "yes" ]; then
              for f in database races; do
                "$TERSER" "$SRC/data/$f.js" --module -c passes=3,toplevel -m toplevel -o "$DEST/data/$f.js"
              done
            fi

            "$CSSO" "$SRC/style.css" -o "$DEST/style.css"

            for f in main core standard-view calendar $EXTRA; do
              node --input-type=module --check < "$DEST/$f.js"
            done
            if [ "$OWN_DATA" = "yes" ]; then
              for f in data/database data/races; do
                node --input-type=module --check < "$DEST/$f.js"
              done
            fi
          }

          # Main owns its data.
          build_one "." "deploy" "settings render-bus" "yes"

          # Preview borrows Main's data via ../data/.
          build_one "preview" "deploy/preview" "settings render-bus" "no"

          # Vendored classic script: minify without --module (shares root copy).
          "$TERSER" kao-banner.js -c passes=3 -m -o deploy/kao-banner.js
          node --check deploy/kao-banner.js

          [ -f CNAME ] && cp CNAME deploy/ || true

      - name: Cache-bust asset URLs
        run: |
          set -e
          # Stable filenames + aggressive caching = users stuck on old bundles.
          # Stamp the commit short-SHA onto local JS/CSS/favicon URLs so each
          # deploy is a cache-miss. Google Fonts URLs are untouched.
          TAG="${GITHUB_SHA::7}"
          sed -i "s#src=\"main.js\"#src=\"main.js?v=${TAG}\"#; s#href=\"style.css\"#href=\"style.css?v=${TAG}\"#; s#href=\"favicon.svg\"#href=\"favicon.svg?v=${TAG}\"#; s#href=\"./favicon.svg\"#href=\"./favicon.svg?v=${TAG}\"#; s#src=\"kao-banner.js?id=#src=\"kao-banner.js?v=${TAG}\&id=#" deploy/index.html
          sed -i "s#src=\"main.js\"#src=\"main.js?v=${TAG}\"#; s#href=\"style.css\"#href=\"style.css?v=${TAG}\"#; s#href=\"../favicon.svg\"#href=\"../favicon.svg?v=${TAG}\"#; s#src=\"../kao-banner.js?id=#src=\"../kao-banner.js?v=${TAG}\&id=#" deploy/preview/index.html
          grep -H 'main\.js?v=' deploy/index.html deploy/preview/index.html
          grep -H 'kao-banner\.js?v=' deploy/index.html deploy/preview/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5