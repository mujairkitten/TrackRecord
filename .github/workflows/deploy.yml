name: Deploy minified to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify shared data layout
        run: |
          # Layout: the Carotene hub owns the site root; Track Record is a
          # subdirectory, and its preview/ testing ground is nested one level
          # deeper still. preview borrows Track Record's data via ../data/,
          # so the preview tree must NOT own its own data/ folder and its JS
          # must not import from ./data/ — either would silently shadow the
          # shared copy and drift out of sync with the main build.

          PREVIEW="trackrecord/preview"

          if [ -d "$PREVIEW/data" ]; then
            echo "::error::$PREVIEW/data/ exists."
            echo "preview is expected to import from ../data/ instead."
            echo "Delete $PREVIEW/data/ and update the JS imports, then re-push."
            exit 1
          fi

          MATCHES="$(grep -rnE "from ['\"]\./data/" "$PREVIEW" --include='*.js' || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Preview still imports from ./data/:"
            echo "$MATCHES"
            echo "Change these to ../data/ to reach the shared copy."
            exit 1
          fi

          # The hub must stay a hub: no tool sources may leak into the root.
          if [ -f main.js ] || [ -d data ]; then
            echo "::error::Tool sources found at the repository root."
            echo "The root is the Carotene landing page; app sources belong in trackrecord/."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify module imports resolve
        # `node --check` (run later, on the minified output) parses each file
        # in isolation and terser does not bundle, so NEITHER catches an
        # import that names a symbol the target module does not export. That
        # mistake passes CI green and then throws, in the browser:
        #   SyntaxError: The requested module './core.js' does not provide an
        #   export named 'typoedName'
        # i.e. a blank page for every visitor. This closes that gap.
        #
        # A single '.' walk covers the whole repo: trackrecord/,
        # trackrecord/preview/ (which imports ../data/ from outside its own
        # directory), and the data modules themselves.
        run: node tools/check-imports.mjs .

      - name: Verify preview sources are in sync
        # preview/ mirrors trackrecord/'s sources (data/, icons/,
        # kao-banner.js and favicon are borrowed via ../, not copied). The
        # only legitimate per-build differences are relative asset paths,
        # the version badge, the build tag, and the cross-link paragraph —
        # see tools/check-preview-sync.mjs. Anything else fails the build.
        run: node tools/check-preview-sync.mjs

      - name: Install minifiers
        run: npm install --no-save --no-package-lock terser@5.51.2 csso-cli@4.0.2

      - name: Build deploy dir
        run: |
          set -e
          TERSER="$(pwd)/node_modules/.bin/terser"
          CSSO="$(pwd)/node_modules/.bin/csso"

          # $3 = space-separated list of extra module files to minify/check
          #      (lets the main build and preview have different module graphs).
          # $4 = 'yes' if this source tree owns its own data/ folder.
          #      trackrecord: yes. preview: no — it imports from ../data/.
          # $5 = 'yes' if this source tree owns its own favicon.svg.
          #      The hub and trackrecord each ship one; preview borrows
          #      trackrecord's via ../favicon.svg and must not copy it again.
          build_one() {
            SRC="$1"
            DEST="$2"
            EXTRA="${3:-}"
            OWN_DATA="${4:-yes}"
            OWN_FAVICON="${5:-yes}"

            mkdir -p "$DEST/icons"
            if [ "$OWN_DATA" = "yes" ]; then
              mkdir -p "$DEST/data"
            fi

            cp "$SRC/index.html" "$DEST/"
            if [ "$OWN_FAVICON" = "yes" ] && [ -f "$SRC/favicon.svg" ]; then
              cp "$SRC/favicon.svg" "$DEST/"
            fi
            # KAO banner is a classic script (no imports): minify plainly, never as a module.
            # preview reuses trackrecord's copy via ../kao-banner.js.
            [ -f "$SRC/kao-banner.js" ] && cp "$SRC/kao-banner.js" "$DEST/" || true
            [ -d "$SRC/icons" ] && cp -R "$SRC/icons/." "$DEST/icons/" || true

            # Aggressive but verified-safe: --module preserves all import/export
            # bindings, so toplevel mangle only touches file-local names.
            for f in main core standard-view calendar $EXTRA; do
              "$TERSER" "$SRC/$f.js" --module -c passes=3,toplevel -m toplevel -o "$DEST/$f.js"
            done

            if [ "$OWN_DATA" = "yes" ]; then
              for f in database races; do
                "$TERSER" "$SRC/data/$f.js" --module -c passes=3,toplevel -m toplevel -o "$DEST/data/$f.js"
              done
            fi

            "$CSSO" "$SRC/style.css" -o "$DEST/style.css"

            for f in main core standard-view calendar $EXTRA; do
              node --input-type=module --check < "$DEST/$f.js"
            done
            if [ "$OWN_DATA" = "yes" ]; then
              for f in data/database data/races; do
                node --input-type=module --check < "$DEST/$f.js"
              done
            fi
          }

          # ---- Carotene hub (site root) ----
          # The landing page, its stylesheet, its theme/modal script and its
          # own favicon. hub.js is a classic script (no imports): never
          # minified as a module.
          mkdir -p deploy
          cp index.html deploy/
          cp favicon.svg deploy/
          cp hub.js deploy/
          "$CSSO" style.css -o deploy/style.css
          node --check deploy/hub.js

          # ---- Track Record ----
          # Owns its data/, icons/ and favicon. Its preview/ borrows them.
          build_one "trackrecord" "deploy/trackrecord" "settings render-bus" "yes" "yes"

          # ---- Track Record preview (testing ground) ----
          # Borrows trackrecord's data/, icons/, favicon and kao-banner via ../.
          build_one "trackrecord/preview" "deploy/trackrecord/preview" "settings render-bus" "no" "no"

          # Vendored classic script: minify without --module (shares trackrecord copy).
          "$TERSER" trackrecord/kao-banner.js -c passes=3 -m -o deploy/trackrecord/kao-banner.js
          node --check deploy/trackrecord/kao-banner.js

          [ -f CNAME ] && cp CNAME deploy/ || true

      - name: Cache-bust asset URLs
        run: |
          set -e
          # Stable filenames + aggressive caching = users stuck on old bundles.
          # Stamp the commit short-SHA onto local JS/CSS/favicon URLs so each
          # deploy is a cache-miss. Google Fonts URLs are untouched.
          # Three pages, three link shapes: the hub uses ./ prefixes, the app
          # uses bare names, preview reaches up with ../.
          TAG="${GITHUB_SHA::7}"

          # Carotene hub: ./style.css, ./favicon.svg, ./hub.js
          sed -i "s#href=\"./style.css\"#href=\"./style.css?v=${TAG}\"#; s#href=\"./favicon.svg\"#href=\"./favicon.svg?v=${TAG}\"#; s#src=\"./hub.js\"#src=\"./hub.js?v=${TAG}\"#" deploy/index.html

          # Track Record: main.js, style.css, ./favicon.svg, kao-banner.js
          sed -i "s#src=\"main.js\"#src=\"main.js?v=${TAG}\"#; s#href=\"style.css\"#href=\"style.css?v=${TAG}\"#; s#href=\"./favicon.svg\"#href=\"./favicon.svg?v=${TAG}\"#; s#src=\"kao-banner.js?id=#src=\"kao-banner.js?v=${TAG}\&id=#" deploy/trackrecord/index.html

          # Track Record preview: same as the app but reaching up with ../
          sed -i "s#src=\"main.js\"#src=\"main.js?v=${TAG}\"#; s#href=\"style.css\"#href=\"style.css?v=${TAG}\"#; s#href=\"../favicon.svg\"#href=\"../favicon.svg?v=${TAG}\"#; s#src=\"../kao-banner.js?id=#src=\"../kao-banner.js?v=${TAG}\&id=#" deploy/trackrecord/preview/index.html

          # Assert every page actually got stamped - a silent no-op here is
          # exactly how users end up pinned to a stale bundle.
          grep -H 'style\.css?v='       deploy/index.html deploy/trackrecord/index.html deploy/trackrecord/preview/index.html
          grep -H 'main\.js?v='         deploy/trackrecord/index.html deploy/trackrecord/preview/index.html
          grep -H 'kao-banner\.js?v='   deploy/trackrecord/index.html deploy/trackrecord/preview/index.html
          grep -H 'hub\.js?v='          deploy/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5